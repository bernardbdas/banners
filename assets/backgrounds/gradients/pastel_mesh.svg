<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <linearGradient id="mesh_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="50%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
    <radialGradient id="mesh_coral" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FECDD3" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFF1F2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh_mint" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#F0FDF4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh_lilac" cx="80%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.60" />
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh_yellow" cx="45%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FEFCE8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1584" height="396" fill="url(#mesh_base)" />

  <!-- Multi-Point Mesh Blobs -->
  <rect width="1584" height="396" fill="url(#mesh_coral)" />
  <rect width="1584" height="396" fill="url(#mesh_lilac)" />
  <rect width="1584" height="396" fill="url(#mesh_mint)" />
  <rect width="1584" height="396" fill="url(#mesh_yellow)" />

  <!-- Soft Accent Glow -->
  <circle cx="1400" cy="80" r="140" fill="#E9D5FF" opacity="0.35" />
</svg>
