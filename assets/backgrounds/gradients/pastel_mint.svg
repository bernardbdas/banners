<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <linearGradient id="mint_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="50%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#F0FDFA" />
    </linearGradient>
    <radialGradient id="mint_glow" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#A7F3D0" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F0FDF4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan_glow" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#BAE6FD" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ECFDF5" stop-opacity="0" />
    </radialGradient>
    <pattern id="mint_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#10B981" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.5" fill="#10B981" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1584" height="396" fill="url(#mint_base)" />
  <rect width="1584" height="396" fill="url(#mint_glow)" />
  <rect width="1584" height="396" fill="url(#cyan_glow)" />

  <!-- Subtle Mint Grid Pattern Overlay -->
  <rect width="1584" height="396" fill="url(#mint_grid)" />

  <!-- Flowing Wave Accent -->
  <path d="M -50 280 Q 400 190 850 290 T 1650 240 L 1650 420 L -50 420 Z" fill="#34D399" opacity="0.06" />
</svg>
