<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <linearGradient id="aurora_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="50%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#FDF2F8" />
    </linearGradient>
    <radialGradient id="aurora_purple" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#E9D5FF" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#FAF5FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora_blue" cx="20%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F0F9FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora_pink" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#FBCFE8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FDF2F8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="aurora_wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1584" height="396" fill="url(#aurora_base)" />

  <!-- Aurora Clouds / Blobs -->
  <rect width="1584" height="396" fill="url(#aurora_purple)" />
  <rect width="1584" height="396" fill="url(#aurora_blue)" />
  <rect width="1584" height="396" fill="url(#aurora_pink)" />

  <!-- Fluid Aurora Curving Bands -->
  <path d="M -100 240 C 300 120 600 360 1000 200 S 1400 100 1700 250 L 1700 450 L -100 450 Z" fill="url(#aurora_wave1)" opacity="0.18" />
  <path d="M -100 280 C 400 180 700 390 1100 240 S 1500 160 1700 300 L 1700 450 L -100 450 Z" fill="url(#aurora_wave1)" opacity="0.12" />

  <!-- Subtle Shimmer Specks -->
  <circle cx="1200" cy="80" r="3" fill="#818CF8" opacity="0.4" />
  <circle cx="1340" cy="140" r="2" fill="#F472B6" opacity="0.5" />
  <circle cx="950" cy="60" r="2.5" fill="#38BDF8" opacity="0.4" />
  <circle cx="1500" cy="95" r="3.5" fill="#C084FC" opacity="0.5" />
</svg>
