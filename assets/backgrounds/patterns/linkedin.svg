<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <!-- Official LinkedIn Platform Brand Blue Gradient Base -->
    <linearGradient id="li_platform_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003870" />
      <stop offset="30%" stop-color="#0A66C2" />
      <stop offset="70%" stop-color="#005299" />
      <stop offset="100%" stop-color="#002952" />
    </linearGradient>

    <!-- LinkedIn Brand Angled Geometric Facet Gradients -->
    <linearGradient id="li_facet_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70B5F9" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0A66C2" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#004182" stop-opacity="0.40" />
    </linearGradient>

    <linearGradient id="li_facet_2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#70B5F9" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="li_facet_3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#002D54" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.15" />
    </linearGradient>

    <!-- Dynamic Flowing Connection Arc Gradients -->
    <linearGradient id="li_arc_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70B5F9" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="li_arc_secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#70B5F9" stop-opacity="0.10" />
    </linearGradient>

    <!-- LinkedIn Micro Dot Matrix Pattern -->
    <pattern id="li_dot_matrix" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#70B5F9" opacity="0.30" />
      <circle cx="20" cy="20" r="1.0" fill="#38BDF8" opacity="0.20" />
    </pattern>

    <!-- Radial High-Energy Brand Glow -->
    <radialGradient id="li_center_glow" cx="80%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#70B5F9" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#0A66C2" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#002952" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1584" height="396" fill="url(#li_platform_bg)" />

  <!-- Ambient Volumetric Brand Fields -->
  <rect width="1584" height="396" fill="url(#li_center_glow)" />
  <circle cx="1420" cy="80" r="240" fill="#70B5F9" opacity="0.20" filter="blur(65px)" />
  <circle cx="220" cy="310" r="220" fill="#003A70" opacity="0.35" filter="blur(60px)" />
  <circle cx="950" cy="340" r="180" fill="#0A66C2" opacity="0.25" filter="blur(50px)" />

  <!-- Background Pattern: Official LinkedIn Platform Geometric Design Architecture -->
  <!-- 1. Technical Platform Dot Grid Matrix (Upper-Right & Safe Zone Accents) -->
  <rect x="750" y="0" width="834" height="396" fill="url(#li_dot_matrix)" />
  <rect x="0" y="0" width="460" height="260" fill="url(#li_dot_matrix)" opacity="0.5" />

  <!-- 2. LinkedIn Brand Geometric Angled Facets (Modern Diagonal Slices) -->
  <g>
    <!-- Facet 1: Far Right Deep Wedge -->
    <polygon points="1350,0 1584,0 1584,396 1220,396" fill="url(#li_facet_3)" />

    <!-- Facet 2: Mid-Right Vibrant Cyan/Sky Slice -->
    <polygon points="1080,0 1380,0 1260,396 960,396" fill="url(#li_facet_1)" />

    <!-- Facet 3: Dynamic Accent Ribbon -->
    <polygon points="860,0 1120,0 990,396 730,396" fill="url(#li_facet_2)" />

    <!-- Facet 4: Subtle Left Counter-Facet -->
    <polygon points="0,0 320,0 140,396 0,396" fill="url(#li_facet_1)" opacity="0.4" />
  </g>

  <!-- 3. Sweeping Modern Dynamic Connection Arcs & Career Velocity Ribbons -->
  <g fill="none">
    <!-- Primary High-Impact Light Stream -->
    <path d="M 680 396 C 820 280, 1140 180, 1584 70" stroke="url(#li_arc_glow)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Parallel Harmonizing Curves -->
    <path d="M 740 396 C 880 290, 1180 200, 1584 95" stroke="url(#li_arc_glow)" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M 620 396 C 780 260, 1100 150, 1584 42" stroke="url(#li_arc_secondary)" stroke-width="1.6" stroke-linecap="round" />

    <!-- Secondary Soft Horizon Ribbons -->
    <path d="M 850 396 C 980 320, 1280 240, 1584 160" stroke="url(#li_arc_secondary)" stroke-width="1.0" stroke-dasharray="6,8" />
    <path d="M 0 160 C 240 160, 480 320, 680 396" stroke="url(#li_arc_secondary)" stroke-width="1.2" stroke-opacity="0.4" />
  </g>

  <!-- 4. LinkedIn Floating Platform Card Architecture (Translucent Geometric UI Tiles) -->
  <g>
    <!-- Top-Right Floating Card Silhouette -->
    <rect x="1340" y="45" width="180" height="90" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#70B5F9" stroke-width="1" stroke-opacity="0.25" />
    <rect x="1360" y="65" width="50" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3" />
    <rect x="1360" y="79" width="110" height="4" rx="2" fill="#70B5F9" fill-opacity="0.25" />
    <rect x="1360" y="89" width="85" height="4" rx="2" fill="#70B5F9" fill-opacity="0.18" />

    <!-- Lower-Right Secondary Floating Tile -->
    <rect x="1240" y="270" width="160" height="75" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.20" />
    <circle cx="1270" cy="300" r="12" fill="#70B5F9" fill-opacity="0.2" />
    <rect x="1295" y="293" width="70" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.25" />
    <rect x="1295" y="304" width="45" height="4" rx="2" fill="#70B5F9" fill-opacity="0.2" />

    <!-- Left Safe-Zone Profile Aura Tile -->
    <rect x="70" y="60" width="140" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#70B5F9" stroke-width="1" stroke-opacity="0.15" />
    <circle cx="100" cy="95" r="14" fill="#38BDF8" fill-opacity="0.15" />
    <rect x="125" y="88" width="55" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.2" />
    <rect x="125" y="99" width="35" height="4" rx="2" fill="#70B5F9" fill-opacity="0.15" />
  </g>

  <!-- 5. Network Hub Nodes & Signal Vertices -->
  <g fill="#FFFFFF">
    <circle cx="1584" cy="70" r="3.5" opacity="0.8" />
    <circle cx="1380" cy="180" r="4.0" opacity="0.9" />
    <circle cx="1140" cy="180" r="3.0" opacity="0.6" />
    <circle cx="980" cy="270" r="3.5" opacity="0.7" />
    <circle cx="820" cy="280" r="3.0" opacity="0.5" />
  </g>
  <g fill="none" stroke="#70B5F9" stroke-width="1.2">
    <circle cx="1380" cy="180" r="8" opacity="0.4" />
    <circle cx="1380" cy="180" r="14" opacity="0.2" stroke-dasharray="2,3" />
    <circle cx="980" cy="270" r="7" opacity="0.35" />
  </g>

  <!-- 6. Precision Brand Registration Marks / Plus Accents -->
  <g stroke="#70B5F9" stroke-width="1.2" stroke-opacity="0.35">
    <path d="M 1250 120 L 1250 110 M 1250 120 L 1250 130 M 1250 120 L 1240 120 M 1250 120 L 1260 120" />
    <path d="M 1480 320 L 1480 312 M 1480 320 L 1480 328 M 1480 320 L 1472 320 M 1480 320 L 1488 320" />
    <path d="M 720 220 L 720 214 M 720 220 L 720 226 M 720 220 L 714 220 M 720 220 L 726 220" />
    <path d="M 380 90 L 380 84 M 380 90 L 380 96 M 380 90 L 374 90 M 380 90 L 386 90" />
  </g>
</svg>
