name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Format, and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (librsvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check code formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint code (ruff)
        run: uv run ruff check .

      - name: Run unit test suite
        run: uv run python -m unittest discover -s tests -v

      - name: Verify banner generation
        run: |
          uv run banners devops all all
          test -f exported/svg/dark/banner_devops.svg
          test -f exported/png/dark/banner_devops.png
          test -f exported/svg/light/banner_devops.svg
          test -f exported/png/light/banner_devops.png
